services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tripboard
      POSTGRES_PASSWORD: tripboard
      POSTGRES_DB: tripboard
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripboard -d tripboard']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tripboard-postgres:/var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tripboard
      MINIO_ROOT_PASSWORD: tripboard-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tripboard-minio:/data

volumes:
  tripboard-postgres:
  tripboard-minio:
