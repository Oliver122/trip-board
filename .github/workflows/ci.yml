name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  static:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripboard
          POSTGRES_PASSWORD: tripboard
          POSTGRES_DB: tripboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripboard -d tripboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tripboard:tripboard@localhost:5432/tripboard
      WEB_PORT: '5180'
      API_PORT: '4080'
      WEB_ORIGIN: http://127.0.0.1:5180
      DISCORD_CLIENT_ID: ci-client
      DISCORD_CLIENT_SECRET: ci-secret
      AUTH_SECRET: ci-auth-secret-value
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tripboard \
            -e MINIO_ROOT_PASSWORD=tripboard-secret \
            cgr.dev/chainguard/minio:latest server /data --console-address :9001
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy." >&2
          exit 1
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:bundle

  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile
            browser: chromium
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripboard
          POSTGRES_PASSWORD: tripboard
          POSTGRES_DB: tripboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripboard -d tripboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tripboard:tripboard@localhost:5432/tripboard
      WEB_PORT: '5180'
      API_PORT: '4080'
      WEB_ORIGIN: http://127.0.0.1:5180
      DISCORD_CLIENT_ID: ci-client
      DISCORD_CLIENT_SECRET: ci-secret
      AUTH_SECRET: ci-auth-secret-value
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tripboard \
            -e MINIO_ROOT_PASSWORD=tripboard-secret \
            cgr.dev/chainguard/minio:latest server /data --console-address :9001
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy." >&2
          exit 1
      - run: pnpm db:seed
      - run: pnpm test:e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 1

  e2e-report:
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: blob-report
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html blob-report
      - run: pnpm exec playwright merge-reports --reporter json blob-report > e2e-report.json
      - name: Write the job summary
        env:
          REPORT_PATH: e2e-report.json
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/e2e-job-summary.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ci-passed:
    if: always()
    needs: [static, build, e2e, e2e-report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: node scripts/ci-passed.mjs

  deploy:
    needs: ci-passed
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Oliver122/trip-board' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_DISCORD_IDS: ${{ vars.ADMIN_DISCORD_IDS }}
      ADMIN_DISCORD_WEBHOOK_URL: ${{ secrets.ADMIN_DISCORD_WEBHOOK_URL }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      NOMINATIM_BASE_URL: ${{ vars.NOMINATIM_BASE_URL }}
      NOMINATIM_USER_AGENT: ${{ vars.NOMINATIM_USER_AGENT }}
      WEB_PORT: ${{ vars.WEB_PORT }}
      API_PORT: ${{ vars.API_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Write deploy.env
        run: bash scripts/write-deploy-env.sh
      - name: Deploy
        run: DEPLOY_ENV="$RUNNER_TEMP/deploy.env" bash scripts/deploy.sh
      - name: Check the public health endpoint
        run: bash scripts/deploy-health.sh
      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.env" "$RUNNER_TEMP/deploy_key"
