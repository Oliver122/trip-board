name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Only on main: proves the pushed commit is what a green pull request run
  # already tested, so the test jobs below can be skipped (scripts/ci-pr-verified.mjs).
  pr-verified:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-verified.mjs

  static:
    if: ${{ !cancelled() && needs.pr-verified.outputs.verified != 'true' }}
    needs: pr-verified
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripboard
          POSTGRES_PASSWORD: tripboard
          POSTGRES_DB: tripboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripboard -d tripboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tripboard:tripboard@localhost:5432/tripboard
      WEB_PORT: '5180'
      API_PORT: '4080'
      WEB_ORIGIN: http://127.0.0.1:5180
      DISCORD_CLIENT_ID: ci-client
      DISCORD_CLIENT_SECRET: ci-secret
      AUTH_SECRET: ci-auth-secret-value
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm lint
      - run: pnpm req:check
      - run: pnpm typecheck
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tripboard \
            -e MINIO_ROOT_PASSWORD=tripboard-secret \
            cgr.dev/chainguard/minio:latest server /data --console-address :9001
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy." >&2
          exit 1
      - run: pnpm test

  build:
    if: ${{ !cancelled() && needs.pr-verified.outputs.verified != 'true' }}
    needs: pr-verified
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check no locale copy is built
        run: test ! -e apps/web/dist/locales
      - name: Check the texture manifest matches the atlas
        run: git diff --exit-code apps/web/src/kinds/texture-manifest.json
      - run: pnpm check:bundle

  e2e:
    if: ${{ !cancelled() && needs.pr-verified.outputs.verified != 'true' }}
    needs: pr-verified
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          # Software WebGL fills both vCPUs, so Firefox runs one worker per
          # job and is split into two shards on separate runners instead.
          - project: firefox
            browser: firefox
            shard: 1/2
          - project: firefox
            browser: firefox
            shard: 2/2
          - project: webkit
            browser: webkit
          - project: mobile
            browser: chromium
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripboard
          POSTGRES_PASSWORD: tripboard
          POSTGRES_DB: tripboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripboard -d tripboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tripboard:tripboard@localhost:5432/tripboard
      WEB_PORT: '5180'
      API_PORT: '4080'
      WEB_ORIGIN: http://127.0.0.1:5180
      DISCORD_CLIENT_ID: ci-client
      DISCORD_CLIENT_SECRET: ci-secret
      AUTH_SECRET: ci-auth-secret-value
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tripboard \
            -e MINIO_ROOT_PASSWORD=tripboard-secret \
            cgr.dev/chainguard/minio:latest server /data --console-address :9001
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy." >&2
          exit 1
      - name: Install software WebGL
        if: matrix.project == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libegl1 xvfb
      - name: Build the web app
        if: matrix.project == 'chromium'
        run: pnpm --filter @tripboard/web build
      - run: pnpm db:seed
      - name: Run Playwright
        run: |
          if [ "${{ matrix.project }}" = "firefox" ]; then
            export LIBGL_ALWAYS_SOFTWARE=1
            export GALLIUM_DRIVER=llvmpipe
            shard="${{ matrix.shard }}"
            export PLAYWRIGHT_BLOB_FILE_NAME="report-firefox-${shard%/*}.zip"
            xvfb-run -a pnpm test:e2e --project=firefox --headed --workers=1 --shard=${{ matrix.shard }}
          else
            pnpm test:e2e --project=${{ matrix.project }}
          fi
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: blob-report/
          retention-days: 1

  e2e-report:
    if: ${{ !cancelled() && needs.pr-verified.outputs.verified != 'true' }}
    needs: [pr-verified, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: blob-report
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html blob-report
      - run: pnpm exec playwright merge-reports --reporter json blob-report > e2e-report.json
      - name: Write the job summary
        env:
          REPORT_PATH: e2e-report.json
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/e2e-job-summary.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ci-passed:
    if: always()
    needs: [pr-verified, static, build, e2e, e2e-report]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require every check to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS: ${{ toJson(needs) }}
        run: node scripts/ci-passed.mjs
      - name: Record the tested tree
        if: ${{ success() && github.event_name == 'pull_request' }}
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir tested-tree
          echo "{\"tree\":\"$tree\",\"pr\":${{ github.event.pull_request.number }}}" > tested-tree/tested-tree.json
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        if: ${{ success() && github.event_name == 'pull_request' }}
        with:
          name: tested-tree-${{ github.event.pull_request.number }}-${{ steps.tree.outputs.tree }}
          path: tested-tree/
          retention-days: 30

  deploy:
    needs: ci-passed
    # Not success(): it also counts the test jobs that pr-verified skips on
    # main, which skipped every deploy. ci-passed already requires them.
    if: ${{ !cancelled() && needs.ci-passed.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'Oliver122/trip-board' }}
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_DISCORD_IDS: ${{ vars.ADMIN_DISCORD_IDS }}
      ADMIN_DISCORD_WEBHOOK_URL: ${{ secrets.ADMIN_DISCORD_WEBHOOK_URL }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      NOMINATIM_BASE_URL: ${{ vars.NOMINATIM_BASE_URL }}
      NOMINATIM_USER_AGENT: ${{ vars.NOMINATIM_USER_AGENT }}
      WEB_PORT: ${{ vars.WEB_PORT }}
      API_PORT: ${{ vars.API_PORT }}
    steps:
      - uses: actions/checkout@v5
      - name: Write deploy.env
        run: bash scripts/write-deploy-env.sh
      - name: Deploy
        run: DEPLOY_ENV="$RUNNER_TEMP/deploy.env" bash scripts/deploy.sh
      - name: Check the public health endpoint
        run: bash scripts/deploy-health.sh
      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.env" "$RUNNER_TEMP/deploy_key"
