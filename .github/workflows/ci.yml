name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripboard
          POSTGRES_PASSWORD: tripboard
          POSTGRES_DB: tripboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripboard -d tripboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tripboard:tripboard@localhost:5432/tripboard
      WEB_PORT: '5180'
      API_PORT: '4080'
      WEB_ORIGIN: http://127.0.0.1:5180
      DISCORD_CLIENT_ID: ci-client
      DISCORD_CLIENT_SECRET: ci-secret
      AUTH_SECRET: ci-auth-secret-value
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
